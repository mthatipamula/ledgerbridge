spring:
  ai:
    mcp:
      client:
        enabled: true
        name: ledgerbridge-mcp-client
        version: 1.0.0
        type: SYNC
        streamable-http:
          connections:
            ledgerbridge-server:
              url: http://localhost:8080
              endpoint: /mcp

    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5:7b
          temperature: 0.1

server:
  port: 8082